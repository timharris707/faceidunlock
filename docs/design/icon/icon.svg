<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Aperture: one machined steel iris of six overlapping blades; its opening is a keyhole whose round top is a head in profile.
       Blade geometry from _work/iris.py (cx 512, cy 506, r 272, edges turn 72 degrees). -->
  <defs>
    <path id="tile" d="M381.28,100 L642.72,100 C723.72,100 764.21,100 807.8,113.78 C855.31,128.8 895.2,168.69 910.22,216.2 C924,259.79 924,300.28 924,381.28 L924,642.72 C924,723.72 924,764.21 910.22,807.8 C895.2,855.31 855.31,895.2 807.8,910.22 C764.21,924 723.72,924 642.72,924 L381.28,924 C300.28,924 259.79,924 216.2,910.22 C168.69,895.2 128.8,855.31 113.78,807.8 C100,764.21 100,723.72 100,642.72 L100,381.28 C100,300.28 100,259.79 113.78,216.2 C128.8,168.69 168.69,128.8 216.2,113.78 C259.79,100 300.28,100 381.28,100 Z"/>
    <path id="kh" transform="translate(500 512) scale(0.86) translate(0 -85)" d="M-66,270 C-68,270 -69,268.6 -68.7,266.6 L-48,124 C-46.4,112 -48,89 -60,80 A100,100 0 1 1 78.8,-61.57 C83.73,-55.26 89.96,-41.91 91,-36 C92.56,-27.14 93.63,-23.98 93,-15 C92.51,-8.02 89.55,-4.21 91.4,1.5 C94.18,10.06 100.37,14.78 105,21.3 C109.63,27.82 115.62,36.31 119.1,41.2 C121.97,45.23 120.25,50.81 115.6,52.5 C110.9,54.21 102.55,56.57 101.2,58.3 C99.97,59.88 102.07,62.08 102.8,65.5 C103.32,67.95 104.78,68.83 104.4,71 C104.05,72.97 102.87,75.73 101.6,77 C102.45,78.59 103.55,80.52 103.2,83 C102.64,86.96 97.2,89 97.2,93.5 C97.2,98.5 103.42,100.51 103,106.5 C102.58,112.49 99.17,117.81 92,120 C78.61,124.09 66.28,122.9 55,127 C51.24,128.37 46,132.08 47,138 L68.7,266.6 C69,268.6 68,270 66,270 Z"/>
    <clipPath id="tileClip"><use href="#tile"/></clipPath>
    <clipPath id="discClip"><circle cx="512" cy="506" r="268"/></clipPath>
    <clipPath id="khClip"><use href="#kh"/></clipPath>
    <clipPath id="w0"><path d="M512 506L518.73 480.89A250 250 0 0 1 783.63 491.76A272 272 0 0 1 660.14 734.12A250 250 0 0 0 537.11 499.27Z"/></clipPath>
    <clipPath id="w1"><path d="M512 506L537.11 499.27A250 250 0 0 1 660.14 734.12A272 272 0 0 1 388.51 748.35A250 250 0 0 0 530.38 524.38Z"/></clipPath>
    <clipPath id="w2"><path d="M512 506L530.38 524.38A250 250 0 0 1 388.51 748.35A272 272 0 0 1 240.37 520.24A250 250 0 0 0 505.27 531.11Z"/></clipPath>
    <clipPath id="w3"><path d="M512 506L505.27 531.11A250 250 0 0 1 240.37 520.24A272 272 0 0 1 363.86 277.88A250 250 0 0 0 486.89 512.73Z"/></clipPath>
    <clipPath id="w4"><path d="M512 506L486.89 512.73A250 250 0 0 1 363.86 277.88A272 272 0 0 1 635.49 263.65A250 250 0 0 0 493.62 487.62Z"/></clipPath>
    <clipPath id="w5"><path d="M512 506L493.62 487.62A250 250 0 0 1 635.49 263.65A272 272 0 0 1 783.63 491.76A250 250 0 0 0 518.73 480.89Z"/></clipPath>
    <mask id="khMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use href="#kh" fill="#000"/>
    </mask>
    <mask id="floorMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <use href="#kh" fill="#fff"/>
      <use href="#kh" transform="translate(0 -10)" fill="#000"/>
    </mask>

    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22304B"/>
      <stop offset="0.45" stop-color="#121B2E"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <radialGradient id="bgLift" cx="512" cy="150" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileRim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.18" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="0.85" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="238" x2="0" y2="774" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9ECF0"/>
      <stop offset="0.45" stop-color="#C3C9D1"/>
      <stop offset="1" stop-color="#7F8895"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="238" x2="0" y2="774" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#1E242E" stop-opacity="0.6"/>
    </linearGradient>
    <!-- bounding-box units: the keyhole path carries its own transform -->
    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050A"/>
      <stop offset="1" stop-color="#0C1424"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="380" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E2633"/>
      <stop offset="1" stop-color="#3A4352"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b1"/>
      <feOffset in="b1" dy="14" result="o1"/>
      <feComponentTransfer in="o1" result="s1"><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="b2"/>
      <feOffset in="b2" dy="2" result="o2"/>
      <feComponentTransfer in="o2" result="s2"><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/></feMerge>
    </filter>
    <filter id="discShadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="b1"/>
      <feOffset in="b1" dy="20" result="o1"/>
      <feComponentTransfer in="o1" result="s1"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b2"/>
      <feOffset in="b2" dy="4" result="o2"/>
      <feComponentTransfer in="o2" result="s2"><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/></feMerge>
    </filter>
    <filter id="blur8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur1" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1"/></filter>
  </defs>

  <!-- tile -->
  <use href="#tile" fill="#000" filter="url(#tileShadow)"/>
  <use href="#tile" fill="url(#bg)"/>
  <use href="#tile" fill="url(#bgLift)"/>
  <g clip-path="url(#tileClip)"><use href="#tile" fill="none" stroke="url(#tileRim)" stroke-width="6"/></g>

  <!-- iris -->
  <circle cx="512" cy="506" r="268" fill="#000" mask="url(#khMask)" filter="url(#discShadow)"/>
  <g mask="url(#khMask)">
    <circle cx="512" cy="506" r="268" fill="url(#metal)"/>
    <g clip-path="url(#discClip)">
      <path d="M512 506L518.73 480.89A250 250 0 0 1 783.63 491.76A272 272 0 0 1 660.14 734.12A250 250 0 0 0 537.11 499.27Z" fill="#0A1222" fill-opacity="0.078"/>
      <path d="M512 506L537.11 499.27A250 250 0 0 1 660.14 734.12A272 272 0 0 1 388.51 748.35A250 250 0 0 0 530.38 524.38Z" fill="#0A1222" fill-opacity="0.128"/>
      <path d="M512 506L530.38 524.38A250 250 0 0 1 388.51 748.35A272 272 0 0 1 240.37 520.24A250 250 0 0 0 505.27 531.11Z" fill="#0A1222" fill-opacity="0.197"/>
      <path d="M512 506L505.27 531.11A250 250 0 0 1 240.37 520.24A272 272 0 0 1 363.86 277.88A250 250 0 0 0 486.89 512.73Z" fill="#FFFFFF" fill-opacity="0.078"/>
      <path d="M512 506L486.89 512.73A250 250 0 0 1 363.86 277.88A272 272 0 0 1 635.49 263.65A250 250 0 0 0 493.62 487.62Z" fill="#FFFFFF" fill-opacity="0.128"/>
      <path d="M512 506L493.62 487.62A250 250 0 0 1 635.49 263.65A272 272 0 0 1 783.63 491.76A250 250 0 0 0 518.73 480.89Z" fill="#FFFFFF" fill-opacity="0.197"/>
      <path d="M518.73 480.89A250 250 0 0 1 783.63 491.76" clip-path="url(#w5)" stroke="#0A1020" stroke-opacity="0.5" stroke-width="26" fill="none" filter="url(#blur8)"/>
      <path d="M537.11 499.27A250 250 0 0 1 660.14 734.12" clip-path="url(#w0)" stroke="#0A1020" stroke-opacity="0.5" stroke-width="26" fill="none" filter="url(#blur8)"/>
      <path d="M530.38 524.38A250 250 0 0 1 388.51 748.35" clip-path="url(#w1)" stroke="#0A1020" stroke-opacity="0.5" stroke-width="26" fill="none" filter="url(#blur8)"/>
      <path d="M505.27 531.11A250 250 0 0 1 240.37 520.24" clip-path="url(#w2)" stroke="#0A1020" stroke-opacity="0.5" stroke-width="26" fill="none" filter="url(#blur8)"/>
      <path d="M486.89 512.73A250 250 0 0 1 363.86 277.88" clip-path="url(#w3)" stroke="#0A1020" stroke-opacity="0.5" stroke-width="26" fill="none" filter="url(#blur8)"/>
      <path d="M493.62 487.62A250 250 0 0 1 635.49 263.65" clip-path="url(#w4)" stroke="#0A1020" stroke-opacity="0.5" stroke-width="26" fill="none" filter="url(#blur8)"/>
      <path d="M518.73 480.89A250 250 0 0 1 783.63 491.76" clip-path="url(#w0)" stroke="#FFFFFF" stroke-opacity="0.56" stroke-width="3" fill="none"/>
      <path d="M537.11 499.27A250 250 0 0 1 660.14 734.12" clip-path="url(#w1)" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" fill="none"/>
      <path d="M530.38 524.38A250 250 0 0 1 388.51 748.35" clip-path="url(#w2)" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" fill="none"/>
      <path d="M505.27 531.11A250 250 0 0 1 240.37 520.24" clip-path="url(#w3)" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" fill="none"/>
      <path d="M486.89 512.73A250 250 0 0 1 363.86 277.88" clip-path="url(#w4)" stroke="#FFFFFF" stroke-opacity="0.89" stroke-width="3" fill="none"/>
      <path d="M493.62 487.62A250 250 0 0 1 635.49 263.65" clip-path="url(#w5)" stroke="#FFFFFF" stroke-opacity="0.90" stroke-width="3" fill="none"/>
    </g>
    <circle cx="512" cy="506" r="263" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="512" cy="506" r="266.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>

  <!-- opening: fine chamfer, deep interior, the lit floor of the cut -->
  <use href="#kh" transform="translate(0 -2.5)" fill="#3A424E" opacity="0.7" filter="url(#blur1)" clip-path="url(#discClip)"/>
  <use href="#kh" transform="translate(0 3.5)" fill="#FFFFFF" opacity="0.85" filter="url(#blur1)" clip-path="url(#discClip)"/>
  <use href="#kh" fill="url(#hole)"/>
  <g clip-path="url(#khClip)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#wall)" mask="url(#floorMask)" filter="url(#blur1)"/>
  </g>
</svg>
